name: Skillscout
options:
  bundleIdPrefix: io.github.eboye
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.6.0"
    CURRENT_PROJECT_VERSION: "7"
targets:
  Skillscout:
    type: application
    platform: macOS
    sources: [Skillscout]
    dependencies:
      - target: SkillscoutCLI
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.eboye.skillscout
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Skillscout
        PRODUCT_NAME: "Skillscout"
        PRODUCT_MODULE_NAME: Skillscout
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: Skillscout/Skillscout.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  SkillscoutCLI:
    type: tool
    platform: macOS
    sources:
      - CLI
      - Skillscout/Models.swift
      - Skillscout/SkillScanner.swift
      - Skillscout/SkillSimilarity.swift
      - Skillscout/PromptLibrary.swift
      - Skillscout/PromptLibrary+Tools.swift
      - Skillscout/SkillInstaller.swift
      - Skillscout/Analyzer.swift
      - Skillscout/AIEngine.swift
    settings:
      base:
        PRODUCT_NAME: skillscout
        PRODUCT_BUNDLE_IDENTIFIER: io.github.eboye.skillscout.cli
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: SkillscoutCLI.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
